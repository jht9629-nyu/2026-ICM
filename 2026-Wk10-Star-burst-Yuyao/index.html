<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Clap & Capture</title>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script>

    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #171923;
        color: #f4efe7;
        font-family: sans-serif;
        text-align: center;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto !important;
        margin: 0 auto 18px;
        border-radius: 14px;
      }

      button {
        margin: 5px;
        padding: 11px 18px;
        background: #ffc8a2;
        color: #171923;
        border: none;
        border-radius: 22px;
        font-size: 15px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      p {
        color: #bcbcc9;
        line-height: 1.6;
      }

      input {
        width: 220px;
        accent-color: #ffc8a2;
      }
    </style>
  </head>

  <body>
    <script src="sketch.js"></script>
  </body>
</html>
